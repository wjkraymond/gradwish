<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graduation Wishes from Our Lecturers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Theme ---------- */
  :root{
    --bg1:#0a1630; --bg2:#13284f; --gold:#d8b45a; --gold2:#f3dc95;
    --ink:#f7f2e4; --muted:#b9c2d6;
    /* one design unit = 1/100 of the largest 16:9 box that fits the screen */
    --u: min(1vw, 1.7778vh);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg1);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  body{
    background:
      radial-gradient(ellipse at 20% 10%, rgba(216,180,90,.13), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(80,120,200,.18), transparent 55%),
      linear-gradient(160deg,var(--bg2),var(--bg1) 70%);
  }
  body.idle{cursor:none}

  /* floating sparkles */
  .sparkles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .sparkles i{position:absolute;bottom:-2vh;width:.5vmin;height:.5vmin;border-radius:50%;background:var(--gold2);opacity:0;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.7}90%{opacity:.5}100%{transform:translateY(-105vh);opacity:0}}

  /* ---------- Stage ---------- */
  .stage{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(var(--u)*2.6) calc(var(--u)*4)}
  header{display:flex;align-items:center;gap:calc(var(--u)*1.2);flex:none}
  header svg{width:calc(var(--u)*3.4);height:auto;flex:none}
  header .t1{font-family:"Playfair Display",serif;font-size:calc(var(--u)*2.1);font-weight:600;letter-spacing:.02em;color:var(--gold2)}
  header .t2{font-size:calc(var(--u)*1.05);color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:calc(var(--u)*.25)}
  header .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(216,180,90,.6),transparent)}

  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,34fr) minmax(0,66fr);align-items:center;gap:calc(var(--u)*5);padding:calc(var(--u)*2.5) calc(var(--u)*2)}

  /* photo */
  .photo-wrap{position:relative;height:100%;max-height:calc(var(--u)*44);aspect-ratio:3/4;justify-self:center;align-self:center}
  .photo-wrap::before{content:"";position:absolute;inset:calc(var(--u)*-1.1);border:1.5px solid rgba(216,180,90,.55);border-radius:999px 999px calc(var(--u)*1.2) calc(var(--u)*1.2)}
  .photo{position:absolute;inset:0;border-radius:999px 999px calc(var(--u)*.8) calc(var(--u)*.8);overflow:hidden;background:linear-gradient(160deg,#1d3566,#0f1f3f);box-shadow:0 calc(var(--u)*2) calc(var(--u)*5) rgba(0,0,0,.45)}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;animation:kenburns 30s ease-in-out infinite alternate}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
  .photo .initials{position:absolute;inset:0;display:grid;place-items:center;font-family:"Playfair Display",serif;font-size:calc(var(--u)*9);color:var(--gold2);letter-spacing:.04em}

  /* text */
  .text{height:100%;max-height:calc(var(--u)*46);display:flex;flex-direction:column;justify-content:center;min-width:0}
  .qmark{font-family:"Playfair Display",serif;color:var(--gold);font-size:calc(var(--u)*9);line-height:.6;height:calc(var(--u)*4.2);flex:none}
  .wish-box{flex:0 1 auto;min-height:0;overflow:hidden;display:flex;align-items:center}
  .wish{font-family:"Playfair Display",serif;font-weight:400;line-height:1.38;color:var(--ink);overflow-wrap:anywhere}
  .sig{flex:none;margin-top:calc(var(--u)*2.6);display:flex;flex-direction:column;gap:calc(var(--u)*.6)}
  .sig .bar{width:calc(var(--u)*6);height:2px;background:var(--gold);margin-bottom:calc(var(--u)*.8)}
  .sig .hon{font-size:calc(var(--u)*1.25);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .sig .name{font-size:calc(var(--u)*2.5);font-weight:600;color:var(--ink);line-height:1.2}

  /* slide transition */
  .slide{transition:opacity .7s ease, transform .7s ease}
  .slide.out{opacity:0;transform:translateY(calc(var(--u)*1.2))}

  /* footer */
  footer{flex:none;display:flex;align-items:center;gap:calc(var(--u)*1.5);font-size:calc(var(--u)*1.05);color:var(--muted)}
  .count{margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:.08em;min-width:5em;text-align:right}
  .controls{display:flex;gap:calc(var(--u)*.5);opacity:.55;transition:opacity .4s}
  .controls:hover,body:not(.idle) .controls{opacity:1}
  body.idle .controls{opacity:0}
  .controls button{font:inherit;font-size:calc(var(--u)*1);color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(216,180,90,.35);border-radius:999px;padding:calc(var(--u)*.35) calc(var(--u)*.9);cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
  .controls button:hover{background:rgba(216,180,90,.18)}
  .status{position:fixed;left:calc(var(--u)*4);bottom:calc(var(--u)*.6);font-size:calc(var(--u)*.8);color:rgba(185,194,214,.5)}

  .panel{position:fixed;right:calc(var(--u)*4);bottom:calc(var(--u)*5);width:min(92vw,440px);background:#0c1a36;border:1px solid rgba(216,180,90,.45);border-radius:14px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:none;z-index:10;font-size:14px}
  .panel.open{display:block}
  .panel h3{font-family:"Playfair Display",serif;font-weight:600;color:var(--gold2);font-size:18px;margin-bottom:12px}
  .panel label{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 5px}
  .panel input,.panel select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 10px}
  .panel select option{background:#13284f}
  .panel .hint{color:rgba(185,194,214,.7);font-size:12px;margin-top:4px}
  .panel .lockrow{display:flex;gap:8px}
  .panel .lockrow input{flex:1}
  .panel .lockrow button{flex:none}
  .panel .hint.bad{color:#f19a8c}
  .panel .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
  .panel button{font:inherit;font-size:14px;border-radius:999px;padding:7px 16px;cursor:pointer;border:1px solid rgba(216,180,90,.5);background:transparent;color:var(--ink)}
  .panel button.primary{background:var(--gold);color:#14213d;border-color:var(--gold);font-weight:600}
  body.panel-open .controls{opacity:1!important}
  body.panel-open{cursor:auto!important}

  .empty{position:fixed;inset:0;display:none;place-items:center;text-align:center;font-family:"Playfair Display",serif;font-size:calc(var(--u)*3);color:var(--muted)}

  /* ---------- Narrow screens (taller than 5:4, e.g. portrait) : stack ---------- */
  @media (max-aspect-ratio: 5/4){
    :root{--u: min(1.25vw, 1.25vh)}
    main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:calc(var(--u)*3);align-items:start;justify-items:center}
    .photo-wrap{height:auto;width:calc(var(--u)*26);max-height:none}
    .text{max-height:none;width:100%;text-align:center;align-items:center}
    .wish-box{flex:1 1 auto;justify-content:center}
    .sig{align-items:center}
    .qmark{text-align:center}
  }
</style>
</head>
<body>
<div class="sparkles" id="sparkles"></div>

<div class="stage">
  <header>
    <svg viewBox="0 0 64 48" aria-hidden="true"><path d="M32 4 2 17l30 13 30-13z" fill="#d8b45a"/><path d="M14 23v11c0 4 8 9 18 9s18-5 18-9V23L32 31z" fill="#b8953f"/><path d="M58 18v16" stroke="#f3dc95" stroke-width="2"/><circle cx="58" cy="36" r="2.6" fill="#f3dc95"/></svg>
    <div>
      <div class="t1" id="title"></div>
      <div class="t2" id="subtitle"></div>
    </div>
    <div class="rule"></div>
  </header>

  <main id="main">
    <div class="photo-wrap slide" id="photoWrap"><div class="photo" id="photo"></div></div>
    <div class="text slide" id="textWrap">
      <div class="qmark">&ldquo;</div>
      <div class="wish-box" id="wishBox"><p class="wish" id="wish"></p></div>
      <div class="sig"><div class="bar"></div><div class="hon" id="hon"></div><div class="name" id="name"></div></div>
    </div>
  </main>

  <footer>
    <div class="count" id="count"></div>
    <div class="controls">
      <button id="prevBtn" title="Previous (←)">&#9664;</button>
      <button id="nextBtn" title="Next (→)">&#9654;</button>
      <button id="speedBtn" title="Change speed (S)"></button>
      <button id="setBtn" title="Settings">&#9881;</button>
      <button id="fsBtn" title="Fullscreen (F)">&#x26F6;</button>
    </div>
  </footer>
</div>
<div class="status" id="status"></div>
<div class="panel" id="panel">
  <h3>Display settings</h3>
  <label for="setYear">Graduating year</label>
  <select id="setYear"></select>
  <label for="setTitle">Title</label>
  <input id="setTitle">
  <div class="hint">{year} is replaced by the year chosen above.</div>
  <label for="setSub">Subtitle</label>
  <input id="setSub">
  <label for="setSheet">Google Sheet link</label>
  <div id="sheetLocked" class="lockrow">
    <input id="setPass" type="password" placeholder="Password to change the sheet" autocomplete="off">
    <button id="unlockBtn" type="button">Unlock</button>
  </div>
  <div class="hint" id="passMsg">Locked. Enter the password to view or change the sheet link.</div>
  <div id="sheetUnlocked" style="display:none">
    <input id="setSheet" placeholder="https://docs.google.com/spreadsheets/d/...">
    <div class="hint">Paste the link to this year's responses sheet. It must be shared as "Anyone with the link: Viewer".</div>
  </div>
  <div class="row"><button id="setReset">Reset to defaults</button><button id="setCancel">Close</button><button class="primary" id="setSave">Save</button></div>
</div>
<div class="empty" id="empty">Waiting for wishes&hellip;</div>

<script>
(()=>{
/* =====================================================================
   SETTINGS: edit these
   ===================================================================== */
const CONFIG = {
  // Google Sheet (must be shared as "Anyone with the link: Viewer")
  SHEET_ID: "1-wRmzuXX3IanDoiWUGZ2FDyT_p2vjFdwHIZ7SFaKNrs",
  GID: "1760492663",
  // Optional: a "File > Share > Publish to web" CSV link. If set, it is used instead.
  CSV_URL: "",

  YEAR: 2026,
  TITLE: "Congratulations, Class of {year}",
  SUBTITLE: "Wishes from your lecturers · Department of Electrical Engineering, Universiti Malaya",

  YEAR_OPTIONS_BACK: 2, YEAR_OPTIONS_AHEAD: 8,   // range shown in the year dropdown
  SPEEDS: [0, 10, 20, 30, 40, 50, 60],   // seconds per wish, 0 = paused
  DEFAULT_SPEED: 20,
  RETRY_SECONDS: 30                      // when the sheet is empty or unreachable
};

/* Lecturer photos. Names are matched loosely (titles, Bin/Binti, Mohd/Mohamed etc. ignored).
   To fix a photo by hand, add an exact entry to PHOTO_OVERRIDES. */
const PHOTO_OVERRIDES = {
  // "Dr. Some Name": "https://example.com/photo.jpg",
};
const E = "https://engine.um.edu.my/Academic%20Staff/", P = "https://umpedac.um.edu.my/";
const PHOTOS = [
  ["Hamzah Bin Arof", E+"HamzahBinArof.JPG"],
  ["Hazlie Bin Mokhlis", E+"HazlieMokhlis.JPG"],
  ["Jeevan Kanesan", E+"JeevanKanesan.JPG"],
  ["Kaharudin Bin Dimyati", E+"KaharudinBinDimyati.JPG"],
  ["Kamarul Ariffin Bin Noordin", E+"KamarulAriffinBinNoordin.JPG"],
  ["Mahidzal Bin Dahari", E+"MahidzalBinDahari.JPG"],
  ["Suhana Binti Mohd Said", E+"SuhanaBintiMohdSaid.JPG"],
  ["Sulaiman Wadi Harun", E+"SulaimanWadiHarun.JPG"],
  ["Harikrishnan Ramiah", E+"HarikrishnanRamiah.JPG"],
  ["Hazlee Azil Bin Illias", E+"HazleeAzilIllias.JPG"],
  ["Anis Salwa Binti Mohd Khairuddin", E+"AnisSalwaKhairuddin.JPG"],
  ["Chow Chee Onn", E+"ChowCheeOnn.JPG"],
  ["Chuah Joon Huang", E+"ChuahJoonHuang.JPG"],
  ["Effariza Binti Hanafi", E+"EffarizaBintiHanafi.jpg"],
  ["Marizan Binti Mubin", E+"MarizanMubin.JPG"],
  ["Narendra Kumar Aridas", E+"NarendraKumar.JPG"],
  ["Norrima Binti Mokhtar", E+"NorrimaBintiMokhtar.jpg"],
  ["Nurulafiqah Nadzirah Binti Mansor", E+"NurulafiqahNadzirahBintiMansor.jpg"],
  ["Sharifah Fatmadiana Binti Wan Muhammad Hatta", E+"SharifahFatmadianaBtWanMuhammadHatta.jpg"],
  ["Tarik Bin Abdul Latef", E+"TarikBinAbdulLatef.JPG"],
  ["Wong Wei Ru", E+"WongWeiRu.JPG"],
  ["A G M Mustayen Billah", E+"MUSTAYENBILLAH.jpg"],
  ["Ahmad Haziq Aiman Bin Rosol", E+"AhmadHaziqAimanBinRosol.jpg"],
  ["Azimah Binti Omar", E+"AzimahBintiOmar.jpg"],
  ["Megat Muhammad Ikhsan Bin Megat Hasnan", E+"MegatMuhammadBinIkhsan.jpg"],
  ["Mohamad Sofian Bin Abu Talip", E+"MohamadSofianAbuTalip.JPG"],
  ["Mohamadariff Bin Othman", E+"MohamadariffBinOthman.JPG"],
  ["Mohammad Aminul Islam", E+"MohammadAminulIslam.jpg"],
  ["Mohd Faiz Bin Mohd Salleh", E+"MohdFaizBinMohdSalleh.JPG"],
  ["Noorhayati Binti Idros", E+"norhayati.jpg"],
  ["Noraisyah Binti Mohd. Shah", E+"NoraisyahMohd.Shah.JPG"],
  ["Tengku Faiz Bin Tengku Mohmed Noor Izam", E+"TengkuFaizBinTengkuMohmedNoorIzam.JPG"],
  ["Wan Amirul Bin Wan Mohd Mahiyiddin", E+"WanAmirulWanMohdMahiyidin.JPG"],
  ["Wong Jee Keen Raymond", E+"WongJeeKeenRaymond.jpg"],
  ["Mahazani Bin Mohamad", E+"MahazaniMohamad.JPG"],
  ["Ma Liya", E+"MALIYA.jpg"],
  ["S. M. Kayser Azam", E+"S.M.KayzerAzam.jpg"],
  ["Saad Mekhilef", E+"Visiting%20Professor/SaadMekhilef.JPG"],
  ["Norhayati Binti Soin", E+"NorhayatiSoin.JPG"],
  ["Raveendran Paramesran", E+"Visiting%20Professor/RaveendranParamesran.JPG"],
  // UMPEDAC
  ["Jeyraj Selvaraj", P+"Prof-Jeyraj_400x400.png"],
  ["Md Hasanuzzaman", P+"Dr-Hasan_400x400.png"],
  ["Siti Rohani Sheikh Raihan", P+"Dr-Siti-Rohani_400x400.png"],
  ["Mohamad Fathi Mohamad Elias", P+"Dr-Fathi_400x400.png"],
  ["Tan Chia Kwang", P+"Dr-Tan_400x400.png"],
  ["Jafferi Jamaludin", P+"Dr-Jafferi_400x400.png"],
  ["Azimah Omar", P+"Dr-Azimah_400x400.png"],
  ["Amirul Syafiq Abdul Jaafar", P+"Dr-Amirul_400x400.png"],
  ["Muhammad Shakeel Ahmad", P+"Dr-Shakeel_400x400.png"],
  ["Shahid Bashir", P+"Dr-Shahid_400x400.png"],
  ["Muhammad Zulhadi Iskandar Radzi", P+"dr_zulhadi_400x400.jpg"],
  ["Asiful Habib", P+"Dr-Asiful-Habib_400x400.png"]
];

/* =====================================================================
   Name handling
   ===================================================================== */
const TITLE_WORDS = new Set(["professor","prof","associate","assoc","assistant","senior","lecturer","emeritus","visiting","adjunct","ir","ts","dr","en","pn","mr","mrs","ms","madam","puan","encik","sr","ar","haji","hajah","hj","hjh","datuk","dato","datin"]);
const FILLER = new Set(["bin","binti","bt","bte","b","a","l","p","al"]);
const MOHD = new Set(["mohd","mohamed","mohamad","muhammad","mohammad","muhamad","mohammed","mohmed","muhd"]);

function tokens(name){
  const t = name.toLowerCase().normalize("NFKD").replace(/[^a-z\s]/g," ").split(/\s+/).filter(Boolean);
  // strip leading titles only (so "Tan Chia Kwang" keeps "tan")
  let i=0; while(i<t.length-1 && TITLE_WORDS.has(t[i])) i++;
  return t.slice(i).filter(w=>!FILLER.has(w)).map(w=>MOHD.has(w)?"mhd":w);
}
/* split "Associate Professor Ir. Dr. Chuah Joon Huang" into honorific + name */
function splitName(full){
  const words = full.trim().split(/\s+/); let i=0;
  while(i<words.length-1 && TITLE_WORDS.has(words[i].toLowerCase().replace(/[^a-z]/g,""))) i++;
  return {hon: words.slice(0,i).join(" "), name: words.slice(i).join(" ")};
}
const PHOTO_INDEX = PHOTOS.map(([n,u])=>({t:tokens(n),u}));
function photoFor(fullName){
  if (PHOTO_OVERRIDES[fullName]) return PHOTO_OVERRIDES[fullName];
  const a = tokens(fullName); if(!a.length) return null;
  let best=null, bestScore=0;
  for(const p of PHOTO_INDEX){
    const shared = a.filter(w=>p.t.includes(w)).length;
    const score = shared / Math.max(a.length, p.t.length);
    if(score>bestScore){bestScore=score;best=p.u}
  }
  return bestScore>=0.6 ? best : null;
}
function initials(name){
  return tokens(name).filter(w=>w!=="mhd").slice(0,2).map(w=>w[0].toUpperCase()).join("");
}

/* =====================================================================
   Sheet loading
   ===================================================================== */
function sheetUrl(){
  const base = CONFIG.CSV_URL ||
    `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&gid=${CONFIG.GID}`;
  return base + (base.includes("?")?"&":"?") + "_=" + Date.now();   // bust cache
}
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f=""}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(f);rows.push(row);row=[];f="" }
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
function cleanWish(s){
  s = s.trim();
  // remove quote marks the lecturer typed around the whole wish (we draw our own)
  while(/^["“”'].*["“”']$/s.test(s) && s.length>2) s = s.slice(1,-1).trim();
  return s;
}
async function loadWishes(){
  const res = await fetch(sheetUrl(), {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const rows = parseCSV(await res.text()).filter(r=>r.some(c=>c.trim()));
  if(!rows.length) return [];
  const head = rows[0].map(h=>h.toLowerCase());
  const col = (...keys)=>head.findIndex(h=>keys.some(k=>h.includes(k)));
  const iName = col("name"), iWish = col("wish","message");
  if(iName<0||iWish<0) throw new Error("Could not find name / wish columns");
  // every submission becomes its own slide, in the order received
  const list = [];
  for(const r of rows.slice(1)){
    const name=(r[iName]||"").trim(), wish=cleanWish(r[iWish]||"");
    if(name && wish) list.push({name,wish});
  }
  return list;
}

/* =====================================================================
   Slideshow
   ===================================================================== */
const $ = id=>document.getElementById(id);
let wishes=[], idx=-1, speed=CONFIG.DEFAULT_SPEED, elapsed=0, lastTick=0, busy=false;
try{ const s=+localStorage.getItem("wishSpeed"); if(CONFIG.SPEEDS.includes(s)&&localStorage.getItem("wishSpeed")!==null) speed=s }catch(e){}
const qs=new URLSearchParams(location.search); if(qs.has("speed")&&CONFIG.SPEEDS.includes(+qs.get("speed"))) speed=+qs.get("speed");

/* ---------- Settings (saved in this browser; URL ?year=2027 also works) ---------- */
const SHEET_PASSWORD_SHA256 = "5280217ae04926cbe9a2b22110d739c282e38e3c4136a924d8bd49728830f094";   // SHA-256 of the settings password
let sheetUnlocked = false;
async function sha256(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function setLock(unlocked){
  sheetUnlocked = unlocked;
  $("sheetLocked").style.display = unlocked ? "none" : "flex";
  $("passMsg").style.display = unlocked ? "none" : "block";
  $("sheetUnlocked").style.display = unlocked ? "block" : "none";
  $("passMsg").textContent = "Locked. Enter the password to view or change the sheet link.";
  $("passMsg").classList.remove("bad"); $("setPass").value = "";
}
async function tryUnlock(){
  let ok=false; try{ ok = (await sha256($("setPass").value)) === SHEET_PASSWORD_SHA256 }catch(e){}
  if(ok){ setLock(true); $("setSheet").focus(); }
  else { $("passMsg").textContent="Incorrect password."; $("passMsg").classList.add("bad"); $("setPass").select(); }
}
$("unlockBtn").onclick = tryUnlock;
$("setPass").addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); });

const DEFAULTS = {year:CONFIG.YEAR, title:CONFIG.TITLE, subtitle:CONFIG.SUBTITLE, sheet:""};
let S = {...DEFAULTS};
try{ Object.assign(S, JSON.parse(localStorage.getItem("wishSettings")||"{}")) }catch(e){}
if(qs.has("year") && /^\d{4}$/.test(qs.get("year"))) S.year=+qs.get("year");

function applySettings(){
  const t = s=>String(s).replace(/\{year\}/gi, S.year);
  $("title").textContent=t(S.title); $("subtitle").textContent=t(S.subtitle);
  document.title=t(S.title);
  const m = (S.sheet||"").match(/\/d\/([a-zA-Z0-9_-]{20,})/);
  if(m){ CONFIG.SHEET_ID=m[1]; const g=S.sheet.match(/gid=(\d+)/); CONFIG.GID=g?g[1]:"0"; CONFIG.CSV_URL=""; }
  else if(/^https?:\/\//.test(S.sheet||"")) CONFIG.CSV_URL=S.sheet;   // a published CSV link
}
function openPanel(){
  const sel=$("setYear"), now=new Date().getFullYear(); sel.innerHTML="";
  const lo=Math.min(now-CONFIG.YEAR_OPTIONS_BACK, S.year), hi=Math.max(now+CONFIG.YEAR_OPTIONS_AHEAD, S.year);
  for(let y=lo;y<=hi;y++){ const o=document.createElement("option"); o.value=o.textContent=y; if(y===+S.year)o.selected=true; sel.appendChild(o) }
  $("setTitle").value=S.title; $("setSub").value=S.subtitle; $("setSheet").value=S.sheet;
  setLock(false);   // the sheet link always starts locked
  $("panel").classList.add("open"); document.body.classList.add("panel-open");
}
function closePanel(){ setLock(false); $("panel").classList.remove("open"); document.body.classList.remove("panel-open"); }
function saveSettings(next){
  const sheetChanged = (next.sheet||"") !== (S.sheet||"");
  S=next; try{localStorage.setItem("wishSettings",JSON.stringify(S))}catch(e){}
  applySettings(); closePanel();
  if(sheetChanged){ wishes=[]; idx=-1; go(1); }
}
$("setBtn").onclick=()=>$("panel").classList.contains("open")?closePanel():openPanel();
$("setCancel").onclick=closePanel;
$("setSave").onclick=()=>saveSettings({year:+$("setYear").value, title:$("setTitle").value.trim()||DEFAULTS.title, subtitle:$("setSub").value.trim(), sheet: sheetUnlocked ? $("setSheet").value.trim() : S.sheet});
$("setReset").onclick=()=>{ saveSettings({...DEFAULTS, sheet: sheetUnlocked ? DEFAULTS.sheet : S.sheet}); };
applySettings();

function setStatus(t){$("status").textContent=t}
function fmtTime(){return new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}

function fitWish(){
  const box=$("wishBox"), p=$("wish"), stacked=matchMedia("(max-aspect-ratio: 5/4)").matches;
  const unit = stacked ? Math.min(innerWidth,innerHeight)*0.0125 : Math.min(innerWidth/100, innerHeight*1.7778/100);
  let hi=4.2, lo=1.3;                // font size range in design units
  p.style.fontSize=(hi*unit)+"px";
  box.style.maxHeight = "";
  const avail = box.parentElement.clientHeight - box.previousElementSibling.offsetHeight - box.nextElementSibling.offsetHeight - unit*3;
  box.style.maxHeight = Math.max(avail, unit*8)+"px";
  if(p.scrollHeight<=box.clientHeight+1) return;
  for(let k=0;k<12;k++){ const m=(hi+lo)/2; p.style.fontSize=(m*unit)+"px"; if(p.scrollHeight<=box.clientHeight+1) lo=m; else hi=m; }
  p.style.fontSize=(lo*unit)+"px";
}

function preload(i){ const w=wishes[i]; if(!w) return; const u=photoFor(w.name); if(u){const im=new Image(); im.src=u} }

function render(w){
  const {hon,name}=splitName(w.name);
  $("hon").textContent=hon; $("name").textContent=name; $("wish").textContent=w.wish;
  const ph=$("photo"); ph.innerHTML="";
  const url=photoFor(w.name);
  const showInitials=()=>{ph.innerHTML=`<div class="initials">${initials(w.name)}</div>`};
  if(url){ const im=new Image(); im.alt=w.name; im.onerror=showInitials; im.src=url; ph.appendChild(im) } else showInitials();
  $("count").textContent=`${idx+1} / ${wishes.length}`;
  fitWish();
}

function showEmpty(on){ $("empty").style.display=on?"grid":"none"; $("main").style.visibility=on?"hidden":"visible"; if(on)$("count").textContent=""; }

async function refresh(){
  try{
    const list=await loadWishes();
    wishes=list; setStatus(`Synced ${fmtTime()} · ${list.length} wishes`);
  }catch(e){
    setStatus(`Could not reach the sheet (${e.message}) · ${fmtTime()}`);
    if(!wishes.length) wishes = (window.SAMPLE||[]);
  }
}

async function go(step){
  if(busy) return; busy=true;
  let next = idx+step;
  if(next>=wishes.length || idx<0){         // reached the end (or first run): re-read the sheet
    await refresh(); next=0;
  } else if(next<0) next=wishes.length-1;
  if(!wishes.length){ showEmpty(true); busy=false; elapsed=0; setTimeout(()=>{idx=-1;go(1)}, CONFIG.RETRY_SECONDS*1000); return; }
  showEmpty(false);
  const parts=[$("photoWrap"),$("textWrap")];
  if(idx>=0){ parts.forEach(p=>p.classList.add("out")); await new Promise(r=>setTimeout(r,650)); }
  idx=next; render(wishes[idx]); preload(idx+1);
  requestAnimationFrame(()=>parts.forEach(p=>p.classList.remove("out")));
  elapsed=0; busy=false;
}

function tick(t){
  const dt = lastTick? (t-lastTick)/1000 : 0; lastTick=t;
  if(speed>0 && !busy && wishes.length){
    elapsed+=dt;
    if(elapsed>=speed) go(1);
  }
  requestAnimationFrame(tick);
}

function updateSpeedBtn(){ $("speedBtn").textContent = speed===0 ? "⏸ Paused" : `⏱ ${speed}s`; }
function cycleSpeed(){
  const i=CONFIG.SPEEDS.indexOf(speed); speed=CONFIG.SPEEDS[(i+1)%CONFIG.SPEEDS.length];
  elapsed=0; updateSpeedBtn(); try{localStorage.setItem("wishSpeed",speed)}catch(e){}
}
function toggleFS(){ try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen() }catch(e){} }

$("speedBtn").onclick=cycleSpeed; $("nextBtn").onclick=()=>go(1); $("prevBtn").onclick=()=>go(-1); $("fsBtn").onclick=toggleFS;
addEventListener("keydown",e=>{
  if(e.key==="Escape") return closePanel();
  if(document.body.classList.contains("panel-open")) return;
  if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="s"||e.key==="S") cycleSpeed(); else if(e.key==="f"||e.key==="F") toggleFS();
});
let idleT; const wake=()=>{document.body.classList.remove("idle"); clearTimeout(idleT); idleT=setTimeout(()=>document.body.classList.add("idle"),3000)};
addEventListener("mousemove",wake); addEventListener("touchstart",wake); wake();
let rz; addEventListener("resize",()=>{clearTimeout(rz); rz=setTimeout(()=>{if(idx>=0)fitWish()},150)});

// sparkles
(function(){const s=$("sparkles"); for(let i=0;i<26;i++){const d=document.createElement("i");
  d.style.left=Math.random()*100+"%"; d.style.animationDuration=(14+Math.random()*18)+"s"; d.style.animationDelay=(-Math.random()*30)+"s";
  const z=.4+Math.random()*.8; d.style.transform=`scale(${z})`; s.appendChild(d);}})();

updateSpeedBtn();
document.fonts.ready.then(()=>go(1));
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
